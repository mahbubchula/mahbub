<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0A1628"/>
  
  <!-- Neural Network Nodes -->
  <g filter="url(#glow)">
    <!-- Central node -->
    <circle cx="32" cy="32" r="6" fill="url(#grad1)"/>
    
    <!-- Outer nodes -->
    <circle cx="16" cy="20" r="4" fill="#00D4FF" opacity="0.8"/>
    <circle cx="48" cy="20" r="4" fill="#00D4FF" opacity="0.8"/>
    <circle cx="16" cy="44" r="4" fill="#10B981" opacity="0.8"/>
    <circle cx="48" cy="44" r="4" fill="#10B981" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="20" y1="22" x2="28" y2="30" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <line x1="44" y1="22" x2="36" y2="30" stroke="#00D4FF" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="42" x2="28" y2="34" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
    <line x1="44" y1="42" x2="36" y2="34" stroke="#10B981" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Horizontal connections -->
    <line x1="20" y1="20" x2="44" y2="20" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="44" x2="44" y2="44" stroke="#10B981" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Road/Path symbol -->
  <path d="M32 48 L32 56" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 52 L32 56 L36 52" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
