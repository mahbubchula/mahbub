name: Update GitHub Repositories

on:
  schedule:
    # Run daily at midnight UTC (7 AM Bangkok time)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch-github-repos.py'

jobs:
  update-repos:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Fetch GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_USERNAME: mahbubchula
        run: |
          python scripts/fetch-github-repos.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/tools.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/tools.json
          git commit -m "🤖 Auto-update: GitHub repositories synced"
          git push
