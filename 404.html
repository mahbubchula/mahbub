<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Mahbub Hassan</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/mahbub/assets/icons/favicon.svg">

    <link rel="stylesheet" href="/mahbub/css/theme-academic.css?v=20261004">
    <link rel="stylesheet" href="/mahbub/css/home.css?v=20261004">
    <style>
        .not-found {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 48px 20px;
            text-align: center;
        }

        .not-found-code {
            font-family: var(--font-display);
            font-size: clamp(5rem, 3rem + 10vw, 9rem);
            line-height: 1;
            color: var(--brand);
            font-style: italic;
        }

        .not-found h1 { font-size: clamp(1.8rem, 1.4rem + 1.6vw, 2.6rem); margin: 12px 0; }
        .not-found p { max-width: 46ch; margin: 0 auto 28px; }
        .not-found .home-cta { justify-content: center; }
    </style>
</head>

<body>
    <script src="/mahbub/js/theme-init.js"></script>
    <main class="not-found">
        <div>
            <p class="eyebrow">Wrong turn</p>
            <div class="not-found-code">404</div>
            <h1>This road doesn&rsquo;t lead anywhere</h1>
            <p>The page you were looking for has moved or no longer exists. Try one of these routes instead.</p>
            <div class="home-cta">
                <a href="/mahbub/" class="btn btn-primary btn-lg">Home</a>
                <a href="/mahbub/pages/publications.html" class="btn btn-secondary btn-lg">Publications</a>
                <a href="/mahbub/pages/contact.html" class="btn btn-ghost btn-lg">Contact</a>

        </div>
    </main>
</body>

</html>
