<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>

    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05060F"/>
      <stop offset="100%" style="stop-color:#1E2148"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.1">
    <line x1="16" y1="0" x2="16" y2="64" stroke="#2DD4BF" stroke-width="0.5"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="#2DD4BF" stroke-width="0.5"/>
    <line x1="48" y1="0" x2="48" y2="64" stroke="#2DD4BF" stroke-width="0.5"/>
    <line x1="0" y1="16" x2="64" y2="16" stroke="#2DD4BF" stroke-width="0.5"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="#2DD4BF" stroke-width="0.5"/>
    <line x1="0" y1="48" x2="64" y2="48" stroke="#2DD4BF" stroke-width="0.5"/>
  </g>

  <!-- Neural Network Nodes -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="8" fill="url(#mainGrad)"/>
    <circle cx="16" cy="18" r="4" fill="#2DD4BF" opacity="0.95"/>
    <circle cx="48" cy="18" r="4" fill="#2DD4BF" opacity="0.95"/>
    <circle cx="16" cy="46" r="4" fill="#FBBF24" opacity="0.95"/>
    <circle cx="48" cy="46" r="4" fill="#FBBF24" opacity="0.95"/>

    <line x1="20" y1="20" x2="26" y2="28" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
    <line x1="44" y1="20" x2="38" y2="28" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="44" x2="26" y2="36" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>
    <line x1="44" y1="44" x2="38" y2="36" stroke="#FBBF24" stroke-width="2" opacity="0.6"/>

    <line x1="20" y1="18" x2="44" y2="18" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
    <line x1="20" y1="46" x2="44" y2="46" stroke="#FBBF24" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Transportation Symbol (Road/Path) -->
  <g filter="url(#glow)">
    <path d="M32 42 L32 54" stroke="url(#mainGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M26 50 L32 56 L38 50" stroke="url(#mainGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Small Accent Dots -->
  <circle cx="32" cy="12" r="2" fill="#2DD4BF" opacity="0.6"/>
  <circle cx="12" cy="32" r="2" fill="#6366F1" opacity="0.6"/>
  <circle cx="52" cy="32" r="2" fill="#FBBF24" opacity="0.6"/>
</svg>
