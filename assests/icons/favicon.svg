<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#1E3A5F"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Inner Shadow -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.3" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1">
    <line x1="16" y1="0" x2="16" y2="64" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="48" y1="0" x2="48" y2="64" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="16" x2="64" y2="16" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="#00D4FF" stroke-width="0.5"/>
    <line x1="0" y1="48" x2="64" y2="48" stroke="#00D4FF" stroke-width="0.5"/>
  </g>
  
  <!-- Neural Network Nodes -->
  <g filter="url(#glow)">
    <!-- Central Hub (represents AI) -->
    <circle cx="32" cy="32" r="8" fill="url(#mainGrad)"/>
    
    <!-- Outer Nodes -->
    <circle cx="16" cy="18" r="4" fill="#00D4FF" opacity="0.9"/>
    <circle cx="48" cy="18" r="4" fill="#00D4FF" opacity="0.9"/>
    <circle cx="16" cy="46" r="4" fill="#10B981" opacity="0.9"/>
    <circle cx="48" cy="46" r="4" fill="#10B981" opacity="0.9"/>
    
    <!-- Connection Lines -->
    <line x1="20" y1="20" x2="26" y2="28" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="44" y1="20" x2="38" y2="28" stroke="#00D4FF" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="44" x2="26" y2="36" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    <line x1="44" y1="44" x2="38" y2="36" stroke="#10B981" stroke-width="2" opacity="0.6"/>
    
    <!-- Horizontal Connections -->
    <line x1="20" y1="18" x2="44" y2="18" stroke="#00D4FF" stroke-width="1.5" opacity="0.3"/>
    <line x1="20" y1="46" x2="44" y2="46" stroke="#10B981" stroke-width="1.5" opacity="0.3"/>
  </g>
  
  <!-- Transportation Symbol (Road/Path) -->
  <g filter="url(#glow)">
    <path d="M32 42 L32 54" stroke="url(#mainGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M26 50 L32 56 L38 50" stroke="url(#mainGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Small Accent Dots -->
  <circle cx="32" cy="12" r="2" fill="#00D4FF" opacity="0.5"/>
  <circle cx="12" cy="32" r="2" fill="#10B981" opacity="0.5"/>
  <circle cx="52" cy="32" r="2" fill="#00D4FF" opacity="0.5"/>
</svg>
